  <circle cx="13" cy="12" r="1" fill="#e2e8f0" />
  <circle cx="17" cy="12" r="1" fill="#38bdf8" />
  <circle cx="21" cy="12" r="1" fill="#e2e8f0" />
  <circle cx="25" cy="12" r="1" fill="#e2e8f0" />
  
  <circle cx="11" cy="15" r="1" fill="#e2e8f0" />
  <circle cx="15" cy="15" r="1" fill="#e2e8f0" />
  <circle cx="19" cy="15" r="1" fill="#e2e8f0" />
  <circle cx="23" cy="15" r="1" fill="#e2e8f0" />
</svg>